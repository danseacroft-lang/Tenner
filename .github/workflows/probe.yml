name: Probe Wikidata
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Tenner/1.0 (github.com/danseacroft-lang/Tenner)"
          Q='SELECT ?t ?nf ?dp ?pv ?pv2 ?hb ?pp ?at WHERE { VALUES ?t {"66732" "1396" "100088"} ?i wdt:P4983 ?t . OPTIONAL{?i wdt:P1874 ?nf} OPTIONAL{?i wdt:P7596 ?dp} OPTIONAL{?i wdt:P8055 ?pv} OPTIONAL{?i wdt:P14440 ?pv2} OPTIONAL{?i wdt:P8298 ?hb} OPTIONAL{?i wdt:P13147 ?pp} OPTIONAL{?i wdt:P9751 ?at} }'
          curl -s -G https://query.wikidata.org/sparql --data-urlencode "query=$Q" -H "Accept: application/sparql-results+json" -H "User-Agent: $UA" -o out.json -w "%{http_code}" > code.txt
          echo "::notice title=code::$(cat code.txt) $(head -c 300 out.json | tr '\n' ' ')"
          echo "::notice title=sparql::$(jq -c '[.results.bindings[] | with_entries(.value |= .value)]' out.json | head -c 900)"
