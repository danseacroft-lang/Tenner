name: Update and deploy

on:
  schedule:
    - cron: '7 * * * *'   # every hour at :07 (GitHub can run scheduled jobs a few minutes late)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # only for the keepalive step below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a normal run takes about a minute; never let a stuck one hold the queue
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch latest charts
        run: node scripts/fetch-data.mjs
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # GitHub pauses scheduled workflows after 60 days without a commit. Re-enabling it every run keeps the hourly
      # schedule alive indefinitely, with no commits and nobody needing to touch the repo.
      - name: Keep the hourly schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
