name: Tenner Layout (Mac app)

# Checks the little Mac app still builds whenever it changes. It never deploys anything.
on:
  push:
    paths: ['mac/**', '.github/workflows/mac.yml']
  workflow_dispatch:

permissions:
  contents: write   # only to publish the ready-made app as a download on GitHub's Releases page

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the app
        run: |
          ./mac/build.sh
          test -x "mac/build/Tenner Layout.app/Contents/MacOS/TennerLayout"
          lipo -info "mac/build/Tenner Layout.app/Contents/MacOS/TennerLayout" | grep -q x86_64   # Intel Macs too
          node --check mac/layout.js
      - name: Zip it for downloading
        run: cd mac/build && ditto -c -k --keepParent "Tenner Layout.app" "Tenner-Layout.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Tenner-Layout
          path: mac/build/Tenner-Layout.zip
          retention-days: 30
      - name: Publish it as a download (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # clear any half-made draft from an earlier try, then make the release once and replace its file each time
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft) | .id' | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh release view mac-app >/dev/null 2>&1 || gh release create mac-app --title "Tenner Layout (Mac app)" --target "$GITHUB_SHA" \
            --notes "The ready-made Tenner Layout app. Unzip it, move it to Applications, and the first time open System Settings → Privacy & Security → Open Anyway."
          gh release upload mac-app "mac/build/Tenner-Layout.zip" --clobber
