# Deploys Tenner TV (tv/) to Cloudflare Workers, at tv.tenner.stream: every three hours with fresh Freeview listings
# (scripts/fetch-tv.mjs), whenever tv/ changes, or when run by hand.
# Uses the same GitHub secrets as the search API: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, plus TMDB_TOKEN (copied in as a
# Worker secret, only to find the channels' logos).
name: Deploy Tenner TV
on:
  push:
    branches: [main]
    paths: ['tv/**', '.github/workflows/tv.yml']
  schedule:
    - cron: '17 */3 * * *'
    - cron: '47 1-23/3 * * *'   # a second try 90 minutes later, as GitHub skips some scheduled runs when it's busy
  workflow_dispatch:
concurrency: { group: tv, cancel-in-progress: true }
permissions:
  contents: read
  actions: write   # only to keep this schedule alive
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check the Cloudflare secrets are there
        id: ready
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}', A: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then echo "::notice title=Tenner TV not deployed::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # the Worker is tried against stand-in listings first; if anything's broken, nothing is deployed
      - name: Check Tenner TV works
        run: node tv/test.mjs
      # the week's Freeview listings for the 35 main channels (the live copy carries over if the feed can't be read)
      - name: Build the listings
        run: node scripts/fetch-tv.mjs
      # the shared copy of the listings lives in Workers KV: made the first time, found after that, bound for this deploy.
      # If the token can't make it, Tenner TV still works (from the edge cache alone).
      - name: Set up the listings store
        if: steps.ready.outputs.go == 'yes'
        continue-on-error: true
        working-directory: tv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          LIST=$(npx --yes wrangler@4 kv namespace list 2>/dev/null || true)
          ID=$(printf '%s' "$LIST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>/tenner-tv$/.test(x.title));console.log(n?n.id:"")}catch{console.log("")}})')
          if [ -z "$ID" ]; then OUT=$(npx --yes wrangler@4 kv namespace create tenner-tv 2>&1 || true); ID=$(printf '%s' "$OUT" | grep -oE '[0-9a-f]{32}' | head -1); fi
          if [ -n "$ID" ]; then printf '\n[[kv_namespaces]]\nbinding = "TV"\nid = "%s"\n' "$ID" >> wrangler.toml; echo "Listings store ready"
          else echo "::warning title=Tenner TV's shared store is off::Couldn't make it. Give the Cloudflare API token 'Workers KV Storage: Edit'. Tenner TV still works without it."; fi
      # first with tv.tenner.stream; if the token isn't allowed to set up the domain, the Worker still goes up (on its
      # workers.dev address) and the run says how to connect the domain by hand
      - name: Deploy to Cloudflare, at tv.tenner.stream
        id: full
        if: steps.ready.outputs.go == 'yes'
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd   # v3.15.0, pinned to the exact release
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tv
          secrets: TMDB_TOKEN
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: Deploy without the domain
        if: steps.ready.outputs.go == 'yes' && steps.full.outcome == 'failure'
        working-directory: tv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          sed -i '/^\[\[routes\]\]/,+2d' wrangler.toml
          npx --yes wrangler@4 deploy
          if [ -n "$TMDB_TOKEN" ]; then printf '%s' "$TMDB_TOKEN" | npx --yes wrangler@4 secret put TMDB_TOKEN; fi
          echo "::warning title=Connect tv.tenner.stream::Tenner TV is live on its workers.dev address. To put it on tv.tenner.stream: Cloudflare dashboard > Workers & Pages > tenner-tv > Settings > Domains & Routes > Add > Custom domain > tv.tenner.stream. (Or give the API token 'Zone: Workers Routes: Edit' and 'Zone: DNS: Edit' for tenner.stream and run this again.)"
      # The Cloudflare token deploys Tenner TV, the search service and accounts. If it was made with an end date, the run
      # says so a month ahead, and fails (so GitHub emails the owner) in the last fortnight, before anything stops deploying.
      - name: Check the Cloudflare token isn't about to run out
        if: steps.ready.outputs.go == 'yes'
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}', A: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          r=$(curl -s -m 30 -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$r" | grep -q '"success":true' || r=$(curl -s -m 30 -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/tokens/verify")
          state=$(printf '%s' "$r" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(!j.success){console.log("unknown");return}const x=j.result||{};console.log(x.status!=="active"?"inactive":x.expires_on?Math.floor((Date.parse(x.expires_on)-Date.now())/864e5):"never")}catch{console.log("unknown")}})')
          case "$state" in
            never) echo "✓ The Cloudflare token has no end date" ;;
            unknown) echo "· Couldn't check the Cloudflare token's end date this time" ;;
            inactive) echo "::error title=Cloudflare token not active::Make a new one in Cloudflare and save it as the CLOUDFLARE_API_TOKEN secret."; exit 1 ;;
            *) echo "The Cloudflare token runs out in $state days"
               if [ "$state" -lt 14 ]; then echo "::error title=Cloudflare token runs out in $state days::Make a new one (or extend it) in Cloudflare > My Profile > API Tokens, and save it as the CLOUDFLARE_API_TOKEN secret."; exit 1; fi
               if [ "$state" -lt 30 ]; then echo "::warning title=Cloudflare token runs out in $state days::Extend it in Cloudflare > My Profile > API Tokens."; fi ;;
          esac
      # GitHub pauses scheduled workflows after 60 days without a commit; re-enabling every run keeps this one going
      - name: Keep the listings schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: gh workflow enable tv.yml
