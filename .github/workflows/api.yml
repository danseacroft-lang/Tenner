# Deploys the search go-between (worker/) to Cloudflare Workers whenever it changes, or when run by hand.
# Needs two GitHub secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. It also copies the existing TMDB_TOKEN
# secret into the Worker, so the key lives only in GitHub and Cloudflare.
name: Deploy search API
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/api.yml']
  workflow_dispatch:
concurrency: { group: api, cancel-in-progress: true }
# the job only reads the code; Cloudflare is reached with its own token, so GitHub's token gets no write access
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check the Cloudflare secrets are there
        id: ready
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}', A: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}', M: '${{ secrets.SUPPORT_EMAIL }}', R: '${{ secrets.RESEND_API_KEY }}' }
        run: |
          if [ -n "$R" ]; then echo "resend=yes" >> "$GITHUB_OUTPUT"; else echo "::notice title=Password reset emails are off::Add RESEND_API_KEY (from resend.com) under Settings > Secrets and variables > Actions."; fi
          if [ -n "$M" ]; then echo "mail=yes" >> "$GITHUB_OUTPUT"; else echo "::notice title=Contact form not connected::Add SUPPORT_EMAIL (the inbox for Contact messages) under Settings > Secrets and variables > Actions."; fi
          if [ -z "$T" ] || [ -z "$A" ]; then echo "::notice title=Search API not deployed::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      # Watchlist alerts keep each subscriber in Workers KV. The store is made the first time and found after that; its
      # binding is added to wrangler.toml just for this deploy. If the token can't make it, alerts stay off; nothing else changes.
      - name: Set up the alerts store
        if: steps.ready.outputs.go == 'yes'
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          LIST=$(npx --yes wrangler@4 kv namespace list 2>/dev/null || true)
          ID=$(printf '%s' "$LIST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>/tenner-push$/.test(x.title));console.log(n?n.id:"")}catch{console.log("")}})')
          if [ -z "$ID" ]; then OUT=$(npx --yes wrangler@4 kv namespace create tenner-push 2>&1 || true); ID=$(printf '%s' "$OUT" | grep -oE '[0-9a-f]{32}' | head -1); fi
          if [ -n "$ID" ]; then printf '\n[[kv_namespaces]]\nbinding = "PUSH"\nid = "%s"\n' "$ID" >> wrangler.toml; echo "Alerts store ready"
          else echo "::warning title=Watchlist alerts are off::Couldn't make the alerts store. Give the Cloudflare API token 'Workers KV Storage: Edit' and run this again."; fi
      # Accounts keep their data in Cloudflare D1: the database is made the first time and found after that, bound for this
      # deploy, and given any tables it's missing. If the token can't make it, accounts stay off; nothing else changes.
      - name: Set up the accounts database
        if: steps.ready.outputs.go == 'yes'
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          LIST=$(npx --yes wrangler@4 d1 list --json 2>/dev/null || true)
          ID=$(printf '%s' "$LIST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>x.name==="tenner-accounts");console.log(n?n.uuid:"")}catch{console.log("")}})')
          if [ -z "$ID" ]; then OUT=$(npx --yes wrangler@4 d1 create tenner-accounts 2>&1 || true); ID=$(printf '%s' "$OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1); fi
          if [ -n "$ID" ]; then
            printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "tenner-accounts"\ndatabase_id = "%s"\n' "$ID" >> wrangler.toml
            npx --yes wrangler@4 d1 execute tenner-accounts --remote --file=schema.sql > /dev/null && echo "Accounts database ready"
          else echo "::warning title=Accounts are off::Couldn't make the accounts database. Give the Cloudflare API token 'D1: Edit' and run this again."; fi
      - name: Deploy to Cloudflare
        if: steps.ready.outputs.go == 'yes'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd   # v3.15.0, pinned to the exact release (it handles the Cloudflare token)
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: TMDB_TOKEN
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      # The alerts' signing key: made once, here, and kept only as a Worker secret (never printed or stored anywhere else)
      - name: Make the alerts signing key
        if: steps.ready.outputs.go == 'yes'
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 secret list 2>/dev/null | grep -q VAPID_JWK; then echo "Signing key already there"; else
            node -e 'crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign"]).then(k=>crypto.subtle.exportKey("jwk",k.privateKey)).then(j=>process.stdout.write(JSON.stringify({kty:j.kty,crv:j.crv,d:j.d,x:j.x,y:j.y})))' | npx --yes wrangler@4 secret put VAPID_JWK
          fi
      - name: Connect the Contact form to the inbox
        if: steps.ready.outputs.go == 'yes' && steps.ready.outputs.mail == 'yes'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: printf '%s' "$SUPPORT_EMAIL" | npx --yes wrangler@4 secret put SUPPORT_EMAIL
      - name: Connect password reset emails
        if: steps.ready.outputs.go == 'yes' && steps.ready.outputs.resend == 'yes'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY
      - name: Check it answers
        if: steps.ready.outputs.go == 'yes'
        run: |
          sleep 5
          U=https://tenner-api.danseacroft.workers.dev
          S=$(curl -s -H "Origin: https://tenner.stream" "$U/search?q=matrix")
          T=$(curl -s -H "Origin: https://tenner.stream" "$U/title/m603")
          echo "Search: $(echo "$S" | jq -r '[.results[]?.title] | .[:5] | join(", ")')"
          echo "Title:  $(echo "$T" | jq -r '.info.title // .error')  ·  UK streaming: $(echo "$T" | jq -r '[.items[]?.f[]?] | length') services"
          P=$(curl -s -H "Origin: https://tenner.stream" "$U/people?q=bette%20midler" | jq -r '.results[0].id // empty')
          echo "People: Bette Midler is $P"
          [ -n "$P" ] && echo "::notice title=Cast & Crew::Bette Midler known for: $(curl -s -H "Origin: https://tenner.stream" "$U/person/$P" | jq -r '[.known[]?.title] | .[:6] | join(", ")')"
          K=$(curl -s -H "Origin: https://tenner.stream" "$U/push/key" | jq -r '.key // .error')
          echo "::notice title=Watchlist alerts::$([ ${#K} -gt 60 ] && echo 'ready' || echo "not ready: $K")"
          A=$(curl -s -H "Origin: https://tenner.stream" "$U/me" | jq -r '.error // "?"')
          echo "::notice title=Accounts::$([ "$A" = "Signed out" ] && echo 'ready' || echo "not ready: $A")"
          echo "Others blocked: $(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://example.com' "$U/search?q=matrix")"
          echo "$S" | jq -e '.results | length > 0' > /dev/null
