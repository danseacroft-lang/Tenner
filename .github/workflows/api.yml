# Deploys the search go-between (worker/) to Cloudflare Workers whenever it changes, or when run by hand.
# Needs two GitHub secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. It also copies the existing TMDB_TOKEN
# secret into the Worker, so the key lives only in GitHub and Cloudflare.
name: Deploy search API
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/api.yml']
  workflow_dispatch:
concurrency: { group: api, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare secrets are there
        id: ready
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}', A: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then echo "::notice title=Search API not deployed::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Cloudflare
        if: steps.ready.outputs.go == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: TMDB_TOKEN
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: Check it answers
        if: steps.ready.outputs.go == 'yes'
        run: |
          sleep 5
          U=https://tenner-api.danseacroft.workers.dev
          S=$(curl -s -H "Origin: https://danseacroft-lang.github.io" "$U/search?q=matrix")
          T=$(curl -s -H "Origin: https://danseacroft-lang.github.io" "$U/title/m603")
          echo "Search: $(echo "$S" | jq -r '[.results[]?.title] | .[:5] | join(", ")')"
          echo "Title:  $(echo "$T" | jq -r '.info.title // .error')  ·  UK streaming: $(echo "$T" | jq -r '[.items[]?.f[]?] | length') services"
          P=$(curl -s -H "Origin: https://danseacroft-lang.github.io" "$U/people?q=bette%20midler" | jq -r '.results[0].id // empty')
          echo "People: Bette Midler is $P"
          [ -n "$P" ] && echo "::notice title=Cast & Crew::Bette Midler known for: $(curl -s -H "Origin: https://danseacroft-lang.github.io" "$U/person/$P" | jq -r '[.known[]?.title] | .[:6] | join(", ")')"
          echo "Others blocked: $(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://example.com' "$U/search?q=matrix")"
          echo "$S" | jq -e '.results | length > 0' > /dev/null
