# Tenner TV (tv.tenner.stream): what's on UK TV tonight. One Worker: the page (public/) and a small endpoint (src/index.js)
# that fetches a day's UK listings from TVmaze, trims them and keeps them at the edge for half an hour. No keys needed.
# Deployed by .github/workflows/tv.yml whenever tv/ changes.
name = "tenner-tv"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# every half hour: fetch today's and tomorrow's listings ahead of time (src/index.js, scheduled). The shared copy lives
# in Workers KV (binding TV), made by the deploy workflow, which adds the binding here before deploying.
[triggers]
crons = ["*/30 * * * *"]

# tv.tenner.stream, made by Cloudflare when this deploys (the deploy workflow drops this if the token can't, and says so)
[[routes]]
pattern = "tv.tenner.stream"
custom_domain = true
