<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tenner">
  <defs>
    <linearGradient id="tn-rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff375f"/>
      <stop offset=".22" stop-color="#ff9f0a"/>
      <stop offset=".42" stop-color="#ffd60a"/>
      <stop offset=".6" stop-color="#30d158"/>
      <stop offset=".8" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <filter id="tn-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="#000"/>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".14"/>
  <!-- the "1" -->
  <path d="M13.5 22.5 20 18v28" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the "0": a rainbow ring with a play button inside -->
  <circle cx="39.5" cy="32" r="12" fill="none" stroke="url(#tn-rainbow)" stroke-width="5.5" filter="url(#tn-glow)"/>
  <path d="M36.6 27.4 44 32l-7.4 4.6z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
