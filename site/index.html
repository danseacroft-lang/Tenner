<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tenner</title>
  <meta name="description" content="The UK's top 10 shows and films right now on Netflix, Disney+, Prime Video, HBO Max and Paramount+. Updated every hour.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Tenner">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org">

  <!-- Link previews in WhatsApp, iMessage, Messenger etc. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tenner">
  <meta property="og:title" content="Tenner: your top ten, every hour">
  <meta property="og:description" content="The UK's top 10 shows and films on Netflix, Disney+, Prime Video, HBO Max and Paramount+.">
  <meta property="og:url" content="https://danseacroft-lang.github.io/Tenner/">
  <meta property="og:image" content="https://danseacroft-lang.github.io/Tenner/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <script>/* Night is the default; Day or Auto only when chosen */
  function tnTheme(t){var r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);
    var c=t==="auto"?null:(t==="light"?"#ffffff":"#000000");document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){if(!m.dataset.c)m.dataset.c=m.content;m.content=c||m.dataset.c;});}
  try{var t=localStorage.getItem("tenner-theme");tnTheme(t==="light"||t==="auto"?t:"dark")}catch(e){tnTheme("dark")}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to the chart</a>

  <!-- Filters for the neon rank numbers -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <filter id="bloom" x="-20%" y="-25%" width="140%" height="150%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.3" result="tight"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="wide"/>
        <feMerge><feMergeNode in="wide"/><feMergeNode in="tight"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="aura" x="-35%" y="-40%" width="170%" height="180%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceGraphic" stdDeviation="11"/>
      </filter>
      <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--num-glass-top)"/><stop offset="1" stop-color="var(--num-glass)"/>
      </linearGradient>
      <linearGradient id="coreFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- the bar at the top: the logo, the tabs (a floating bar at the bottom on phones) and the round button -->
  <div class="top-row">
    <div class="top-brand">
      <a class="lt-logo" href="#top" aria-label="Tenner, back to the top"><img src="logo.svg" alt="" width="36" height="36"></a>
      <span class="brand-name">Tenner</span>
    </div>
    <nav class="tabbar" aria-label="Pages"><div class="tabs" role="tablist" id="tabs"><span class="tab-ind" id="tabInd" aria-hidden="true"></span>
      <button type="button" role="tab" data-tab="search" aria-selected="false" tabindex="-1">
        <svg class="i-o" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
        <svg class="i-f" viewBox="0 0 24 24" aria-hidden="true"><circle class="thick" cx="10.5" cy="10.5" r="6.5" fill="none"/><path class="thick" d="M15.5 15.5 20 20"/></svg>
        <span>Search</span></button>
      <button type="button" role="tab" data-tab="top" aria-selected="true">
        <svg class="i-o" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.5h8v5a4 4 0 0 1-8 0z"/><path d="M8 6.5H5.5a2.5 2.5 0 0 0 2.6 3.4M16 6.5h2.5a2.5 2.5 0 0 1-2.6 3.4M12 13.5v3.5M8.5 20h7M10 17h4"/></svg>
        <svg class="i-f" viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M7.3 3.8h9.4v5.7a4.7 4.7 0 0 1-9.4 0z"/><path class="thick" d="M7.6 6.5H5.5a2.5 2.5 0 0 0 2.6 3.4M16.4 6.5h2.1a2.5 2.5 0 0 1-2.6 3.4M12 14v3M8.5 20h7"/></svg>
        <span>Top 10</span></button>
      <button type="button" role="tab" data-tab="new" aria-selected="false" tabindex="-1">
        <svg class="i-o" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3.5l1.8 4.9 4.9 1.8-4.9 1.8-1.8 4.9-1.8-4.9-4.9-1.8 4.9-1.8z"/><path d="M18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z"/></svg>
        <svg class="i-f" viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M10.5 2.5l2.1 5.4 5.4 2.1-5.4 2.1-2.1 5.4-2.1-5.4L3 10l5.4-2.1z"/><path class="solid" d="M18 13.5l1.1 2.4 2.4 1.1-2.4 1.1L18 20.5l-1.1-2.4-2.4-1.1 2.4-1.1z"/></svg>
        <span>New</span></button>
      <button type="button" role="tab" data-tab="browse" aria-selected="false" tabindex="-1">
        <svg class="i-o" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
        <svg class="i-f" viewBox="0 0 24 24" aria-hidden="true"><rect class="solid" x="3" y="3" width="8" height="8" rx="2.2"/><rect class="solid" x="13" y="3" width="8" height="8" rx="2.2"/><rect class="solid" x="3" y="13" width="8" height="8" rx="2.2"/><rect class="solid" x="13" y="13" width="8" height="8" rx="2.2"/></svg>
        <span>Browse</span></button>
      <button type="button" role="tab" data-tab="watchlist" aria-selected="false" tabindex="-1">
        <svg class="i-o" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17L12 16.6 6.5 20.5z"/></svg>
        <svg class="i-f" viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M6 3h12v18.4l-6-4.2-6 4.2z"/></svg>
        <span>Watchlist</span></button>
    </div></nav>
    <div class="side-links" aria-label="Site information">
      <a class="side-link" href="legal.html#terms">Terms of Service</a>
      <a class="side-link" href="legal.html#privacy">Privacy Policy</a>
      <a class="side-link" href="legal.html#cookies">Cookies</a>
      <a class="side-link" href="contact.html">Contact</a>
      <span class="side-ver">Tenner 1.2.1</span>
    </div>
    <a class="side-about side-settings" href="settings.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-2.6-1.5L14.2 2.6h-4l-.4 2.5A7.6 7.6 0 0 0 7.2 6.6l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>Settings</span></a>
    <a class="side-about" href="about.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 11v5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.1" fill="currentColor"/></svg><span>About</span></a>
    <div class="top-act">
      <a class="tb-btn tb-about tb-settings" href="settings.html" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-2.6-1.5L14.2 2.6h-4l-.4 2.5A7.6 7.6 0 0 0 7.2 6.6l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></a>
      <a class="tb-btn tb-about" href="about.html" aria-label="About Tenner" title="About"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.3" fill="currentColor"/></svg></a>
      <button type="button" class="tb-btn" id="thBtn" aria-haspopup="menu" aria-controls="thPop" aria-expanded="false" aria-label="Theme" title="Theme"><span id="thIc" style="display:contents"></span></button>
    </div>
  </div>

  <div class="tb-pop th-pop" id="thPop" role="menu" aria-labelledby="thH" popover>
    <div class="tb-head"><h2 id="thH">Theme</h2></div>
    <div class="th-list"><button type="button" role="menuitemradio" data-mode="auto" aria-checked="false"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 3.4a8.6 8.6 0 0 1 0 17.2z" fill="currentColor"/></svg></i><span><b>Auto</b><small>Follows your device</small></span><em aria-hidden="true"></em></button><button type="button" role="menuitemradio" data-mode="light" aria-checked="false"><i><svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg></i><span><b>Day</b><small>Light all the time</small></span><em aria-hidden="true"></em></button><button type="button" role="menuitemradio" data-mode="dark" aria-checked="false"><i><svg class="ic-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 14.7A8.5 8.5 0 1 1 9.3 3.5a7 7 0 0 0 11.2 11.2Z"/></svg></i><span><b>Night</b><small>Dark all the time</small></span><em aria-hidden="true"></em></button></div>
  </div>


  <main id="main" tabindex="-1">
    <!-- computers: the chart's top title as a big backdrop that fades into the page on its left and bottom -->
    <div class="backdrop" id="backdrop" aria-hidden="true"></div>
    <!-- the same artwork, mirrored and blurred, under the glass sidebar (Apple's "background extension" effect) -->
    <div class="bd-ext" id="bdExt" aria-hidden="true"></div>
    <section class="intro wrap" id="controls" hidden>
      <h1 id="heading" class="large-title">Top 10</h1>
      <p class="lede sub">
        <span id="lede">On all five services in the UK</span>
        <button type="button" id="refresh" class="updated" aria-live="polite" title="Check for a newer chart">
          <span class="live-dot" aria-hidden="true"></span><span id="ago">Updated just now</span></button>
        <button type="button" id="shareChart" class="share-chart" title="Share this chart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M6 11v8.5h12V11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Share</button>
      </p>
      <div class="controls">
        <div class="segmented kind" role="radiogroup" aria-label="Shows, films or both">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" role="radio" data-kind="tv" aria-checked="true">Shows</button>
          <button type="button" role="radio" data-kind="movie" aria-checked="false">Films</button>
          <button type="button" role="radio" data-kind="both" aria-checked="false">Both</button>
        </div>
        <div class="svc at-start at-end"><div class="svc-track" id="svc" role="radiogroup" aria-label="Choose a service">
          <span class="svc-ind" id="svcInd" aria-hidden="true"></span>
        </div></div>
        <!-- phones: the services as the phone's own picker, under Shows | Films -->
        <label class="dd" id="svcDD"><span class="dd-ic"></span><span class="dd-l">All</span><span class="dd-chev" aria-hidden="true"></span>
          <select id="svcSel" aria-label="Choose a service"></select></label>
      </div>
    </section>

    <div id="view"><p class="wrap muted loading">Loading the chart…</p></div>
  </main>


  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="shell.js" defer></script>
  <script src="sheet.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
