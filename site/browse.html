  <script>/* Night is the default; Day or Auto only when chosen */
  function tnTheme(t){var r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);
    var c=t==="auto"?null:(t==="light"?"#ffffff":"#000000");document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){if(!m.dataset.c)m.dataset.c=m.content;m.content=c||m.dataset.c;});}
  try{var t=localStorage.getItem("tenner-theme");tnTheme(t==="light"||t==="auto"?t:"dark")}catch(e){tnTheme("dark")}
  try{if(!(JSON.parse(localStorage.getItem("tenner-settings")||"{}").anim)||matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("still")}catch(e){document.documentElement.classList.add("still")}</script>

<body class="browse">

    </div>
    <nav class="tabbar" aria-label="Pages"><div class="tabs" role="tablist" id="tabs"><span class="tab-ind" id="tabInd" aria-hidden="true"></span>

        <svg class="i-f" viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M10.5 2.5l2.1 5.4 5.4 2.1-5.4 2.1-2.1 5.4-2.1-5.4L3 10l5.4-2.1z"/><path class="solid" d="M18 13.5l1.1 2.4 2.4 1.1-2.4 1.1L18 20.5l-1.1-2.4-2.4-1.1 2.4-1.1z"/></svg>

      <button type="button" role="tab" data-tab="browse" aria-selected="true">

        <svg class="i-f" viewBox="0 0 24 24" aria-hidden="true"><rect class="solid" x="3" y="3" width="8" height="8" rx="2.2"/><rect class="solid" x="13" y="3" width="8" height="8" rx="2.2"/><rect class="solid" x="3" y="13" width="8" height="8" rx="2.2"/><rect class="solid" x="13" y="13" width="8" height="8" rx="2.2"/></svg>
        <span>Browse</span></button>
      <button type="button" role="tab" data-tab="people" aria-selected="false" tabindex="-1">

        <svg class="i-f" viewBox="0 0 24 24" aria-hidden="true"><circle class="solid" cx="9" cy="8.5" r="3.8"/><path class="solid" d="M2.5 20c.7-3.8 3.4-6.2 6.5-6.2s5.8 2.4 6.5 6.2z"/><circle class="solid" cx="17.2" cy="9.4" r="2.9"/><path class="solid" d="M16.6 14c2.9 0 5 2 5.6 5.4h-4.9c-.2-2-.8-3.8-1.9-5.2z"/></svg>
        <span>Cast &amp; Crew</span></button>
      <button type="button" role="tab" data-tab="watchlist" aria-selected="false" tabindex="-1">

        <span>Watchlist</span></button>
    </div></nav>

      <a class="side-link" href="contact.html">Contact</a>
      <span class="side-ver">Tenner 1.6.2</span>
    </div>
    <a class="side-about side-settings" href="settings.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-2.6-1.5L14.2 2.6h-4l-.4 2.5A7.6 7.6 0 0 0 7.2 6.6l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>Settings</span></a>
    <a class="side-about" href="about.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 11v5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.1" fill="currentColor"/></svg><span>About</span></a>
    <div class="top-act">
      <a class="tb-btn tb-about tb-settings" href="settings.html" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-2.6-1.5L14.2 2.6h-4l-.4 2.5A7.6 7.6 0 0 0 7.2 6.6l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></a>
      <a class="tb-btn tb-about" href="about.html" aria-label="About Tenner" title="About"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.3" fill="currentColor"/></svg></a>
      <button type="button" class="tb-btn" id="thBtn" aria-haspopup="menu" aria-controls="thPop" aria-expanded="false" aria-label="Theme" title="Theme"><span id="thIc" style="display:contents"></span></button>
    </div>
  </div>

  <div class="tb-pop th-pop" id="thPop" role="menu" aria-labelledby="thH" popover>
    <div class="tb-head"><h2 id="thH">Theme</h2></div>
    <div class="th-list"><button type="button" role="menuitemradio" data-mode="auto" aria-checked="false"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 3.4a8.6 8.6 0 0 1 0 17.2z" fill="currentColor"/></svg></i><span><b>Auto</b><small>Follows your device</small></span><em aria-hidden="true"></em></button><button type="button" role="menuitemradio" data-mode="light" aria-checked="false"><i><svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg></i><span><b>Day</b><small>Light all the time</small></span><em aria-hidden="true"></em></button><button type="button" role="menuitemradio" data-mode="dark" aria-checked="false"><i><svg class="ic-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 14.7A8.5 8.5 0 1 1 9.3 3.5a7 7 0 0 0 11.2 11.2Z"/></svg></i><span><b>Night</b><small>Dark all the time</small></span><em aria-hidden="true"></em></button></div>
  </div>



  <main id="main" class="bwrap" tabindex="-1">
    <header class="b-head">
      <div>
        <h1 class="large-title">Browse</h1>
        <p class="lede">Every popular show and film on the five services, in one place. <a href="people.html" class="b-people">Search cast &amp; crew</a></p>
      </div>
      <div class="segmented" role="radiogroup" aria-label="Shows, films or both">
        <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" role="radio" data-kind="tv" aria-checked="true">Shows</button>
        <button type="button" role="radio" data-kind="movie" aria-checked="false">Films</button>
        <button type="button" role="radio" data-kind="both" aria-checked="false">Both</button>
      </div>
    </header>

    <div class="search" role="search">
      <svg class="s-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search shows and films" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Search shows and films">
      <kbd class="s-key" aria-hidden="true">/</kbd>
      <button type="button" class="s-clear" id="qClear" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="var(--bg)" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>

    <div class="coll at-start at-end"><div class="coll-track" id="coll" role="radiogroup" aria-label="Collections"><span class="coll-ind" id="collInd" aria-hidden="true"></span></div></div>

    <div class="b-body">
      <aside class="filters" id="filters" aria-label="Filters">
        <div class="sheet-head"><h2>Filters</h2><button type="button" class="btn btn-tinted" id="done">Done</button></div>
        <section class="panel" id="pWhere">
          <h3>Where to watch <button type="button" class="mine-link" id="mineLink">My services</button></h3>
          <div class="where" id="where"></div>
        </section>
        <section class="panel">
          <h3>Sort by</h3>
          <div class="sort" id="sort" role="radiogroup" aria-label="Sort by"></div>
        </section>
        <section class="panel">
          <h3>Genres</h3>
          <div class="genres" id="genres"></div>
        </section>
        <section class="panel">
          <h3><label for="rating">Rated at least</label> <output id="ratingOut" for="rating">Any</output></h3>
          <input type="range" id="rating" min="0" max="9" step="0.5" value="0">
          <div class="scale" aria-hidden="true"><span>Any</span><span>5</span><span>7</span><span>9</span></div>
        </section>
        <button type="button" class="btn btn-tinted clear" id="clear">Clear filters</button>
      </aside>

      <section class="results" aria-labelledby="count">
        <div class="r-bar">
          <p id="count" class="count" aria-live="polite">Loading…</p>
          <button type="button" class="btn btn-tinted f-btn" id="openFilters" aria-controls="filters" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            Filters<span class="badge" id="fCount" hidden></span></button>
        </div>
        <ol class="grid" id="grid"></ol>
        <div class="more" id="more" aria-hidden="true"></div>
        <section class="web" id="web" aria-labelledby="webH" hidden>
          <div class="web-hd"><h2 id="webH">All films &amp; shows</h2><p class="count" id="webNote" aria-live="polite"></p></div>
          <ol class="grid" id="webGrid"></ol>
        </section>
      </section>
    </div>
  </main>
  <div class="scrim" id="scrim" hidden></div>


  <script src="shell.js" defer></script>
  <script src="links.js" defer></script>
  <script src="sheet.js" defer></script>
  <script src="browse.js" defer></script>
</body>
</html>
