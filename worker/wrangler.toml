# Tenner's search go-between on Cloudflare Workers. Deployed by .github/workflows/api.yml whenever worker/ changes.
# The TMDB key is a Worker secret (TMDB_TOKEN), copied in from GitHub's secret by that workflow: it never appears here.
name = "tenner-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Sites allowed to use it (comma-separated): tenner.stream, plus the old GitHub address while links to it are still around.
ALLOWED_ORIGINS = "https://tenner.stream,https://www.tenner.stream,https://tv.tenner.stream,https://danseacroft-lang.github.io,http://localhost:8777,http://localhost:8778,http://localhost:8779,http://localhost:8780,http://127.0.0.1:8780"

# The Contact form emails Tenner's inbox through Cloudflare Email Routing (on tenner.stream). No address here: the
# inbox is a Worker secret (SUPPORT_EMAIL), and it has to be a verified destination address in Email Routing.
# Sign in with Google: the OAuth client ID from Google Cloud (public, not a secret). Empty: the Google button stays hidden.
GOOGLE_CLIENT_ID = "573684167951-69isfjep31v7kl8hs0083228flhbq53e.apps.googleusercontent.com"

[[send_email]]
name = "MAILER"

# Watchlist alerts (src/push.js): checked every hour. The KV namespace (PUSH) is created by the deploy workflow, which
# adds its binding here before deploying.
[triggers]
crons = ["23 * * * *"]

# Accounts (src/auth.js): Cloudflare D1. The deploy workflow creates the database the first time, adds its binding
# (DB) here before deploying, and applies schema.sql.
